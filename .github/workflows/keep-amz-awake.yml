name: Keep AMZ Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-amz-awake.yml"

permissions:
  contents: read

concurrency:
  group: amz-render-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Ping AMZ Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live website
        env:
          SITE_URL: https://amz-catalog-live.onrender.com/
        run: |
          set -euo pipefail
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Checking $SITE_URL"

          status="$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 90 \
            --output /tmp/amz-response.html \
            --write-out '%{http_code}' \
            "$SITE_URL")"

          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "AMZ returned an unsuccessful HTTP status."
            head -c 1000 /tmp/amz-response.html || true
            exit 1
          fi

          echo "AMZ is responding successfully."
