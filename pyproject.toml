[project]
name = "amz-catalog-cloudflare"
version = "1.1.5"
description = "AMZ software catalog on Cloudflare Workers and D1"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "workers-py>=1.72.0",
    "workers-runtime-sdk",
]
