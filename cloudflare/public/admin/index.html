<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مدیریت AMZ</title><link rel="stylesheet" href="/style.css"><style>
.admin-wrap{max-width:1000px;margin:40px auto;padding:20px}.panel{background:#171c28;border:1px solid #293246;border-radius:16px;padding:20px;margin:18px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.fields input,.fields textarea{width:100%;box-sizing:border-box;background:#0f1420;color:#fff;border:1px solid #39445b;border-radius:9px;padding:12px;font:inherit}.fields textarea{min-height:80px}.admin-btn{background:#536dfe;color:#fff;border:0;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}.danger{background:#9f3549}.admin-list{display:grid;gap:10px}.admin-row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#101622;border-radius:10px;padding:12px;flex-wrap:wrap}.muted{color:#9ba8bd}.status{white-space:pre-wrap;color:#b7c7ff}
</style></head><body><header class="top"><a class="brand" href="/">AMZ<span>.</span></a><span class="tag">مدیریت کاتالوگ</span></header>
<main class="admin-wrap"><p class="eyebrow">ADMIN CONTROL</p><h1>پنل مدیریت AMZ</h1><p class="muted">توکن مدیریت را وارد کن؛ در این نشست مرورگر نگه‌داری می‌شود.</p>
<section class="panel"><h2>وضعیت کاتالوگ</h2><p id="stats" class="status">در حال اتصال…</p><button id="sync" class="admin-btn">همگام‌سازی همه منابع</button><button id="logout" class="admin-btn danger">خروج</button><p id="message" class="status"></p></section>
<section class="panel"><h2>افزودن نرم‌افزار</h2><form id="software" class="fields">
<input name="slug" placeholder="شناسه انگلیسی مثل firefox" required><input name="name" placeholder="نام نرم‌افزار" required><input name="category" placeholder="دسته‌بندی"><input name="os" placeholder="سیستم‌عامل‌ها"><input name="version" placeholder="نسخه"><input name="icon_url" placeholder="لینک آیکون HTTPS"><input name="homepage_url" placeholder="وب‌سایت رسمی HTTPS"><input name="download_url" placeholder="صفحه دریافت HTTPS"><textarea name="summary" placeholder="توضیح کوتاه"></textarea><textarea name="description" placeholder="توضیحات"></textarea><button class="admin-btn" type="submit">ذخیره نرم‌افزار</button></form></section>
<section class="panel"><h2>منابع API سفارشی</h2><form id="source" class="fields"><input name="name" placeholder="نام منبع" required><input name="url" placeholder="آدرس API با HTTPS" required><input name="records_path" value="items" placeholder="مسیر رکوردها"><input name="token" type="password" placeholder="Bearer token اختیاری"><input name="page_size" type="number" min="1" max="100" value="100"><input name="max_pages" type="number" min="1" max="20" value="5"><input name="mapping" placeholder='Mapping JSON اختیاری'><button class="admin-btn" type="submit">ثبت منبع</button></form><div id="sources" class="admin-list"></div></section>
<section class="panel"><h2>وضعیت همگام‌سازی</h2><div id="sync-list" class="admin-list"></div></section><section class="panel"><h2>نرم‌افزارهای اخیر</h2><div id="software-list" class="admin-list"></div></section></main><script src="/admin.js" defer></script></body></html>
